# Reel Remote landing page — static Vite build served straight from disk.
#
# Behind Cloudflare with SSL mode Full (strict), so the origin certificate below
# is the Cloudflare origin cert, the same pair the other jasgun.me sites use.
#
#   sudo cp deploy/nginx/reelremote.jasgun.me.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/reelremote.jasgun.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name reelremote.jasgun.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reelremote.jasgun.me;

    ssl_certificate     /etc/ssl/cloudflare/jasgun.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jasgun.me.key;

    # `npm run build` output. Using rsync of dist/ instead? Drop the /web.
    root /var/www/reelremote/web/dist;
    index index.html;

    access_log /var/log/nginx/reelremote.access.log;
    error_log  /var/log/nginx/reelremote.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Vite content-hashes every asset filename, so these can cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point must never be cached or a deploy will not take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should be reachable even if it ends up in the web root.
    location ~ /\. {
        deny all;
    }
}
