# Reel Remote landing page — static Vite build served straight from disk.
#
# HTTP only as committed. TLS is added by Certbot, matching the other sites on
# this host:
#
#   sudo cp deploy/nginx/reelremote.jasgun.me.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/reelremote.jasgun.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d reelremote.jasgun.me
#
# Certbot rewrites this file in place, adding the 443 server block, the
# certificate paths and the 80 -> 443 redirect. Copy the result back over this
# file afterwards so the repo matches what the server actually runs.

server {
    listen 80;
    listen [::]:80;
    server_name reelremote.jasgun.me;

    # `npm run build` output. Using rsync of dist/ instead? Drop the /web.
    root /var/www/reelremote/web/dist;
    index index.html;

    access_log /var/log/nginx/reelremote.access.log;
    error_log  /var/log/nginx/reelremote.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Vite content-hashes every asset filename, so these can cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point must never be cached or a deploy will not take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should be reachable even if it ends up in the web root.
    location ~ /\. {
        deny all;
    }
}
